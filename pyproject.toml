[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-serverless"
version = "0.1.0"
description = "Unofficial Python client for Nebius Serverless AI Jobs and Endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Mikhail Rozhkov" },
    { name = "Evgeny Zholkovskiy" },
]
keywords = ["nebius", "serverless", "gpu", "jobs", "endpoints"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Compatible ranges, so the package installs next to users' own pins.
# uv.lock keeps the exact versions for development and CI.
dependencies = [
    "nebius>=0.6.43,<0.7",
    "pydantic>=2,<3",
    "PyYAML>=6",
    "rich>=13",
]

[project.optional-dependencies]
# Integrations, one extra each. The core does not need them.
prefect = ["prefect>=3,<4"]

[project.urls]
Documentation = "https://mnrozhkov.github.io/nebius-serverless/"
Repository = "https://github.com/mnrozhkov/nebius-serverless"
Issues = "https://github.com/mnrozhkov/nebius-serverless/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nebius_serverless = ["py.typed"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "prefect==3.9.5 ; python_full_version >= '3.11'",
    "pytest==9.0.3",
    "ruff==0.14.2",
    "typing-extensions==4.16.0",
]
# The docs site (mkdocs.yml). mkdocs-material needs Python 3.11 or later;
# [imaging] is for social cards, which need Cairo and are built in CI only;
# the docs workflow builds on 3.12.
docs = [
    "mkdocs-material[imaging]==9.8.2; python_version >= '3.11'",
]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
mypy_path = "src"
