# Build the documentation site (mkdocs.yml) on every pull request, and
# publish it to GitHub Pages from main.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a deploy halfway; superseded pull request builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Cairo, for the social cards
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: uv sync --locked --only-group docs
      - name: mkdocs build --strict
        # Strict: a broken link, missing anchor, or page left out of the
        # nav fails the build.
        run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
